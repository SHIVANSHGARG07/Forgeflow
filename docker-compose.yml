# docker-compose.yml: postgres + scheduler + worker, sab containers me chalte hain.
# `docker compose up -d --build` se start hoga.
# Containers aapas me service name se baat karte hain (postgres, scheduler) -
# localhost nahi, kyunki har container ka apna alag network namespace hota hai.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobflow
      POSTGRES_PASSWORD: jobflow
      POSTGRES_DB: jobflow
    ports:
    - "5432:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/scheduler.Dockerfile
    environment:
      DATABASE_URL: postgres://jobflow:jobflow@postgres:5432/jobflow?sslmode=disable
    ports:
    - "50051:50051"
    depends_on:
    - postgres

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://jobflow:jobflow@postgres:5432/jobflow?sslmode=disable
      SCHEDULER_ADDR: scheduler:50051
    depends_on:
    - scheduler

volumes:
  pgdata: