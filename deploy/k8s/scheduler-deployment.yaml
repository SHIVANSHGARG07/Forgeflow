# scheduler-deployment.yaml
# Scheduler ka Deployment - local image use karta hai (kind load se cluster
# ke andar daali thi), isliye imagePullPolicy: Never zaroori hai, warna K8s
# Docker Hub se pull karne ki koshish karega aur fail hoga.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: jobflow-scheduler:test
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          env:
            - name: DATABASE_URL
              value: "postgres://jobflow:jobflow@postgres:5432/jobflow?sslmode=disable"
